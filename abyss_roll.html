<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>어비스 롤: 피의 카지노 (Abyss Roll: Blood Casino)</title>
<style>
  :root {
    --bg-dark: #07080c;
    --panel-bg: #10121a;
    --border-gold: #c5a059;
    --crimson: #8b0000;
    --blood-red: #ff2222;
    --bone-white: #e2dcc8;
    --safe-gold: #ffd700;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg-dark);
    color: var(--bone-white);
    font-family: 'Cinzel', 'Noto Serif KR', serif, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #mobile-viewport {
    width: 100vw;
    max-width: 440px;
    height: 100vh;
    max-height: 920px;
    background: radial-gradient(circle at 50% 30%, #151824 0%, #08090e 100%);
    border: 2px solid #2a2015;
    box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* 횃불 비네팅 오버레이 */
  #torch-vignette {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
    transition: box-shadow 0.5s ease;
    z-index: 10;
  }

  /* 상단 35% - 던전 전투 뷰 */
  #top-battle-view {
    height: 34%;
    position: relative;
    border-bottom: 2px solid #2d261e;
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
    background: linear-gradient(180deg, rgba(20,5,5,0.4) 0%, rgba(10,12,18,0.8) 100%);
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--border-gold);
    letter-spacing: 1px;
    text-shadow: 0 1px 3px #000;
  }
  .torch-gauge {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ff9933;
    font-weight: bold;
  }
  .stage-arena {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 6px;
    position: relative;
  }
  .party-row, .monster-row {
    display: flex;
    gap: 6px;
    align-items: flex-end;
    z-index: 2;
  }
  .entity-unit {
    width: 44px;
    height: 74px;
    background: #171924;
    border: 1px solid #3d3528;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .entity-unit.hero { border-color: #4a5d42; }
  .entity-unit.monster { border-color: #7a2b2b; }
  .entity-unit.active-turn {
    transform: scale(1.1) translateY(-6px);
    box-shadow: 0 0 12px var(--border-gold);
    border-color: var(--border-gold);
  }
  .entity-avatar {
    font-size: 24px;
    margin-top: 4px;
  }
  .hp-bar-outer, .stress-bar-outer {
    width: 36px;
    height: 5px;
    background: #000;
    border-radius: 2px;
    margin-top: 3px;
    overflow: hidden;
  }
  .hp-bar-inner { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s; }
  .stress-bar-inner { width: 0%; height: 100%; background: #9b59b6; transition: width 0.2s; }

  /* 중단 36% - 엘드리치 카지노 & 주사위 베팅 보드 */
  #middle-casino-board {
    height: 36%;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: rgba(14, 16, 24, 0.95);
    border-bottom: 2px solid #2d261e;
    position: relative;
  }
  .double-down-panel {
    background: linear-gradient(135deg, #1c0808 0%, #0d0e14 100%);
    border: 2px solid var(--crimson);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(139,0,0,0.3);
  }
  .multiplier-badge {
    font-size: 28px;
    font-weight: 900;
    color: var(--safe-gold);
    text-shadow: 0 0 10px rgba(255,215,0,0.6);
  }
  .pot-info {
    text-align: right;
  }
  .pot-val {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
  }
  .bust-warning {
    font-size: 10px;
    color: var(--blood-red);
    font-weight: bold;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .dice-tray {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin: 6px 0;
  }
  .dice-slot {
    width: 68px;
    height: 74px;
    background: #191c28;
    border: 2px solid #4a3c2c;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
  }
  .dice-slot.held {
    border-color: var(--safe-gold);
    background: #2a2215;
    box-shadow: 0 0 10px rgba(255,215,0,0.5);
  }
  .dice-slot.held::after {
    content: "LOCKED";
    position: absolute;
    top: 2px;
    font-size: 8px;
    color: var(--safe-gold);
    font-weight: bold;
  }
  .dice-value {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
  }
  .dice-type-tag {
    font-size: 9px;
    color: #a89f91;
    margin-top: 2px;
  }
  .combat-log-ticker {
    background: #090a0f;
    border: 1px solid #23201d;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: #c0b8a4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 하단 30% - 원핸드 도박 & 전술 버튼 */
  #bottom-tactics-bar {
    height: 30%;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #090a0f;
    justify-content: center;
  }
  .gamble-actions-row {
    display: flex;
    gap: 8px;
    height: 48%;
  }
  .btn-gamble-push {
    flex: 1.2;
    background: linear-gradient(180deg, #b31212 0%, #6e0000 100%);
    border: 2px solid #ff4444;
    border-radius: 6px;
    color: #fff;
    font-weight: 900;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,0,0,0.3);
    transition: transform 0.08s;
  }
  .btn-gamble-bank {
    flex: 1;
    background: linear-gradient(180deg, #1b7a3e 0%, #0d4a24 100%);
    border: 2px solid #2ecc71;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(46,204,113,0.3);
    transition: transform 0.08s;
  }
  .btn-gamble-push:active, .btn-gamble-bank:active, .tactics-btn:active {
    transform: scale(0.96);
  }
  .sub-actions-row {
    display: flex;
    gap: 6px;
    height: 44%;
  }
  .tactics-btn {
    flex: 1;
    background: #181b26;
    border: 1px solid #4a3e2e;
    border-radius: 5px;
    color: var(--bone-white);
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  /* 컷인 오버레이 연출 */
  #cutin-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.88);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .cutin-clash {
    display: flex;
    align-items: center;
    justify-content: space-around;
    width: 100%;
    position: relative;
  }
  .cutin-char {
    font-size: 72px;
    transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .slash-fx {
    position: absolute;
    width: 260px;
    height: 6px;
    background: #ff2222;
    box-shadow: 0 0 20px #ff2222, 0 0 40px #fff;
    transform: rotate(-35deg) scaleX(0);
    transition: transform 0.1s ease-out;
  }
  .cutin-dmg-text {
    font-size: 42px;
    font-weight: 900;
    color: var(--blood-red);
    text-shadow: 0 0 15px #000;
    margin-top: 24px;
    transform: scale(0.5);
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* BUST 자멸 폭발 연출 */
  .bust-screen-shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translate3d(-3px, 0, 0); }
    20%, 80% { transform: translate3d(5px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }
</style>
</head>
<body>

<div id="mobile-viewport">
  <div id="torch-vignette"></div>

  <!-- 상단: 전투 아레나 -->
  <div id="top-battle-view">
    <div class="header-bar">
      <div id="floor-title">DEPTHS 1 : CRYPT CASINO</div>
      <div class="torch-gauge">
        <span>🔥 횃불</span>
        <span id="torch-val">100%</span>
      </div>
    </div>

    <div class="stage-arena">
      <!-- 4인 아군 파티 -->
      <div class="party-row" id="hero-party">
        <div class="entity-unit hero" id="hero-0">
          <div class="entity-avatar">🛡️</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="h-hp-0"></div></div>
          <div class="stress-bar-outer"><div class="stress-bar-inner" id="h-st-0"></div></div>
        </div>
        <div class="entity-unit hero" id="hero-1">
          <div class="entity-avatar">🪓</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="h-hp-1"></div></div>
          <div class="stress-bar-outer"><div class="stress-bar-inner" id="h-st-1"></div></div>
        </div>
        <div class="entity-unit hero" id="hero-2">
          <div class="entity-avatar">🏹</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="h-hp-2"></div></div>
          <div class="stress-bar-outer"><div class="stress-bar-inner" id="h-st-2"></div></div>
        </div>
        <div class="entity-unit hero" id="hero-3">
          <div class="entity-avatar">🔮</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="h-hp-3"></div></div>
          <div class="stress-bar-outer"><div class="stress-bar-inner" id="h-st-3"></div></div>
        </div>
      </div>

      <!-- 몬스터 라인업 -->
      <div class="monster-row" id="monster-party">
        <div class="entity-unit monster" id="mon-0">
          <div class="entity-avatar">💀</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="m-hp-0"></div></div>
        </div>
        <div class="entity-unit monster" id="mon-1">
          <div class="entity-avatar">🧙‍♂️</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="m-hp-1"></div></div>
        </div>
        <div class="entity-unit monster" id="mon-2">
          <div class="entity-avatar">🦇</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="m-hp-2"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 중단: 푸시 유어 럭 주사위 도박 보드 -->
  <div id="middle-casino-board">
    <div class="double-down-panel">
      <div>
        <div class="multiplier-badge" id="mult-badge">1X</div>
        <div class="bust-warning" id="bust-label">⚠️ 주사위 [1] 나오면 자멸!</div>
      </div>
      <div class="pot-info">
        <div style="font-size: 11px; color: #a89f91;">누적 배팅 화력</div>
        <div class="pot-val" id="pot-display">0 POT</div>
      </div>
    </div>

    <!-- 주사위 4개 트레이 -->
    <div class="dice-tray">
      <div class="dice-slot" id="slot-0" onclick="toggleHold(0)">
        <div class="dice-value" id="dval-0">-</div>
        <div class="dice-type-tag" id="dtag-0">D6 뼈</div>
      </div>
      <div class="dice-slot" id="slot-1" onclick="toggleHold(1)">
        <div class="dice-value" id="dval-1">-</div>
        <div class="dice-type-tag" id="dtag-1">D6 뼈</div>
      </div>
      <div class="dice-slot" id="slot-2" onclick="toggleHold(2)">
        <div class="dice-value" id="dval-2">-</div>
        <div class="dice-type-tag" id="dtag-2">D8 황동</div>
      </div>
      <div class="dice-slot" id="slot-3" onclick="toggleHold(3)">
        <div class="dice-value" id="dval-3">-</div>
        <div class="dice-type-tag" id="dtag-3">D20 황금</div>
      </div>
    </div>

    <div class="combat-log-ticker" id="log-ticker">
      🎲 주사위를 던져 배팅 팟을 키우고, 묻고 더블로 가십시오!
    </div>
  </div>

  <!-- 하단: 원핸드 컨트롤러 -->
  <div id="bottom-tactics-bar">
    <div class="gamble-actions-row">
      <button class="btn-gamble-push" id="btn-push" onclick="pushDoubleDown()">
        <span>🔥 묻고 더블로!</span>
        <span style="font-size: 10px; font-weight: normal; opacity: 0.9;">(Gamble x2)</span>
      </button>
      <button class="btn-gamble-bank" id="btn-bank" onclick="bankAndStrike()">
        <span>💰 멈추고 타격!</span>
        <span style="font-size: 10px; font-weight: normal; opacity: 0.9;">(Cash Out)</span>
      </button>
    </div>

    <div class="sub-actions-row">
      <button class="tactics-btn" onclick="initialRoll()">
        <span>🎲 주사위 굴리기</span>
      </button>
      <button class="tactics-btn" onclick="rerollUnlocked()">
        <span>🔄 리롤 (<span id="reroll-count">2</span>)</span>
      </button>
      <button class="tactics-btn" onclick="lightTorch()">
        <span>🔥 횃불 밝히기</span>
      </button>
      <button class="tactics-btn" onclick="upgradeToD20()">
        <span>✨ D20 각성</span>
      </button>
    </div>
  </div>

  <!-- 다키스트 타격 컷인 오버레이 -->
  <div id="cutin-overlay">
    <div class="cutin-clash">
      <div class="cutin-char" id="cutin-attacker">🛡️</div>
      <div class="slash-fx" id="slash-fx"></div>
      <div class="cutin-char" id="cutin-target">💀</div>
    </div>
    <div class="cutin-dmg-text" id="cutin-dmg">CRITICAL!<br>-360</div>
  </div>
</div>

<script>
// Web Audio 프로시저럴 사운드 합성기
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function initAudio() { if (!actx) actx = new AudioCtx(); }

function playDiceSound() {
  initAudio();
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(450, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, actx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.3, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.1);
}

function playHeavySlashSound() {
  initAudio();
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(150, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.8, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.25);
}

function playBustSound() {
  initAudio();
  // 저음 불협화음 파멸 징소리
  [85, 115, 175].forEach(freq => {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.4, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + 0.6);
  });
}

// 게임 상태
let torch = 100;
let multiplier = 1;
let currentPot = 0;
let rerollsLeft = 2;
let heldSlots = [false, false, false, false];
let diceValues = [0, 0, 0, 0];
let diceSides = [6, 6, 8, 20];

let heroes = [
  { name: '흑기사', maxHp: 120, hp: 120, stress: 0, icon: '🛡️' },
  { name: '광전사', maxHp: 95, hp: 95, stress: 0, icon: '🪓' },
  { name: '사냥꾼', maxHp: 80, hp: 80, stress: 0, icon: '🏹' },
  { name: '방랑자', maxHp: 75, hp: 75, stress: 0, icon: '🔮' }
];

let monsters = [
  { name: '해골 검사', maxHp: 80, hp: 80, icon: '💀' },
  { name: '뼈 주술사', maxHp: 65, hp: 65, icon: '🧙‍♂️' },
  { name: '흡혈 박쥐', maxHp: 45, hp: 45, icon: '🦇' }
];

function toggleHold(idx) {
  heldSlots[idx] = !heldSlots[idx];
  document.getElementById(`slot-${idx}`).classList.toggle('held', heldSlots[idx]);
  playDiceSound();
}

function initialRoll() {
  playDiceSound();
  let baseSum = 0;
  for (let i = 0; i < 4; i++) {
    if (!heldSlots[i]) {
      diceValues[i] = Math.floor(Math.random() * diceSides[i]) + 1;
      document.getElementById(`dval-${i}`).innerText = diceValues[i];
    }
    baseSum += diceValues[i];
  }
  multiplier = 1;
  currentPot = baseSum * 12;
  updateCasinoUI();
  setLog(`🎲 주사위 합계 [${baseSum}]! 기본 판돈 [${currentPot} POT] 생성! 묻고 더블로 가시겠습니까?`);
}

function rerollUnlocked() {
  if (rerollsLeft <= 0) {
    setLog('⚠️ 남은 리롤 횟수가 없습니다!');
    return;
  }
  rerollsLeft--;
  document.getElementById('reroll-count').innerText = rerollsLeft;
  playDiceSound();
  for (let i = 0; i < 4; i++) {
    if (!heldSlots[i]) {
      diceValues[i] = Math.floor(Math.random() * diceSides[i]) + 1;
      document.getElementById(`dval-${i}`).innerText = diceValues[i];
    }
  }
  setLog('🔄 고정되지 않은 주사위를 다시 굴렸습니다!');
}

function pushDoubleDown() {
  if (currentPot <= 0) {
    initialRoll();
    return;
  }
  playDiceSound();

  // 배수별 자멸 기준치
  let bustThreshold = multiplier === 1 ? 1 : (multiplier === 2 ? 2 : (multiplier === 4 ? 3 : 4));
  let testRoll = Math.floor(Math.random() * 6) + 1;

  if (testRoll <= bustThreshold) {
    // BUST! 탐욕의 파멸!
    playBustSound();
    document.getElementById('mobile-viewport').classList.add('bust-screen-shake');
    setTimeout(() => document.getElementById('mobile-viewport').classList.remove('bust-screen-shake'), 400);

    setLog(`💀 [BUST!] 주사위 [${testRoll}] 등장! 탐욕에 눈이 멀어 ${currentPot} POT 전액 소멸!`);
    currentPot = 0;
    multiplier = 1;
    updateCasinoUI();

    // 아군 전체 스트레스 폭증
    heroes.forEach((h, i) => {
      h.stress = Math.min(100, h.stress + 25);
      document.getElementById(`h-st-${i}`).style.width = `${h.stress}%`;
    });
    return;
  }

  // 성공! 묻고 더블로!
  multiplier *= 2;
  currentPot = (currentPot * 2) + (testRoll * 30);
  updateCasinoUI();
  setLog(`🔥 [JACKPOT!] 주사위 [${testRoll}] 돌파! 배수 ${multiplier}X 폭증! 현재 화력: ${currentPot} POT!`);
}

function bankAndStrike() {
  if (currentPot <= 0) {
    setLog('⚠️ 타격할 배팅 판돈이 없습니다. 먼저 굴리세요!');
    return;
  }

  let finalDmg = currentPot;
  currentPot = 0;
  let mult = multiplier;
  multiplier = 1;
  updateCasinoUI();

  // 살아있는 첫 몬스터 타격
  let target = monsters.find(m => m.hp > 0);
  if (!target) {
    setLog('🏆 방 안의 모든 적이 이미 전멸했습니다!');
    return;
  }

  triggerCutIn('🛡️', target.icon, finalDmg, mult >= 4, () => {
    target.hp = Math.max(0, target.hp - finalDmg);
    updateEntityUI();
    setLog(`⚔️ ${mult}배수 극대화 타격! ${target.name}에게 ${finalDmg} 데미지 작렬!`);

    if (monsters.every(m => m.hp <= 0)) {
      setTimeout(() => {
        alert('🎉 던전 룸 클리어! 대량의 가보와 황금 유물을 획득했습니다!');
        respawnMonsters();
      }, 500);
    } else {
      setTimeout(enemyTurn, 600);
    }
  });
}

function enemyTurn() {
  let aliveMonsters = monsters.filter(m => m.hp > 0);
  if (aliveMonsters.length === 0) return;

  let attacker = aliveMonsters[Math.floor(Math.random() * aliveMonsters.length)];
  let targetHero = heroes[Math.floor(Math.random() * heroes.length)];

  let dmg = Math.floor(Math.random() * 20) + 15;
  targetHero.hp = Math.max(0, targetHero.hp - dmg);
  targetHero.stress = Math.min(100, targetHero.stress + 10);
  playHeavySlashSound();
  updateEntityUI();

  setLog(`🩸 ${attacker.name}의 반격! ${targetHero.name}에게 ${dmg} 피해!`);
  torch = Math.max(0, torch - 5);
  document.getElementById('torch-val').innerText = `${torch}%`;
}

function triggerCutIn(attackerIcon, targetIcon, dmg, isCrit, cb) {
  playHeavySlashSound();
  const overlay = document.getElementById('cutin-overlay');
  const cutinDmg = document.getElementById('cutin-dmg');
  const slash = document.getElementById('slash-fx');

  document.getElementById('cutin-attacker').innerText = attackerIcon;
  document.getElementById('cutin-target').innerText = targetIcon;
  cutinDmg.innerHTML = isCrit ? `🔥 잭팟 치명타!<br>-${dmg}` : `-${dmg}`;

  overlay.style.display = 'flex';
  setTimeout(() => slash.style.transform = 'rotate(-35deg) scaleX(1)', 50);
  setTimeout(() => cutinDmg.style.transform = 'scale(1.2)', 100);

  setTimeout(() => {
    overlay.style.display = 'none';
    slash.style.transform = 'rotate(-35deg) scaleX(0)';
    cutinDmg.style.transform = 'scale(0.5)';
    cb();
  }, 650);
}

function updateCasinoUI() {
  document.getElementById('mult-badge').innerText = `${multiplier}X`;
  document.getElementById('pot-display').innerText = `${currentPot} POT`;

  let bustThresh = multiplier === 1 ? 1 : (multiplier === 2 ? 2 : (multiplier === 4 ? 3 : 4));
  document.getElementById('bust-label').innerText = `⚠️ 주사위 [1 ~ ${bustThresh}] 나오면 자멸!`;
}

function updateEntityUI() {
  heroes.forEach((h, i) => {
    document.getElementById(`h-hp-${i}`).style.width = `${(h.hp / h.maxHp) * 100}%`;
    document.getElementById(`h-st-${i}`).style.width = `${h.stress}%`;
  });
  monsters.forEach((m, i) => {
    const el = document.getElementById(`m-hp-${i}`);
    if (el) el.style.width = `${(m.hp / m.maxHp) * 100}%`;
  });
}

function lightTorch() {
  torch = Math.min(100, torch + 25);
  document.getElementById('torch-val').innerText = `${torch}%`;
  setLog('🔥 횃불을 밝혀 칠흑의 어둠을 몰아냅니다.');
}

function upgradeToD20() {
  diceSides[3] = 20;
  document.getElementById('dtag-3').innerText = 'D20 황금';
  setLog('✨ 4번 슬롯 주사위가 20면체(D20) 황금 주사위로 승급했습니다!');
}

function respawnMonsters() {
  monsters = [
    { name: '화산 골렘 (보스)', maxHp: 400, hp: 400, icon: '👹' },
    { name: '망령 사제', maxHp: 120, hp: 120, icon: '🧙‍♂️' },
    { name: '지옥견', maxHp: 90, hp: 90, icon: '🐺' }
  ];
  document.getElementById('floor-title').innerText = 'DEPTHS 2 : BRIMSTONE ALTAR';
  updateEntityUI();
}

function setLog(msg) {
  document.getElementById('log-ticker').innerText = msg;
}

// 시작 시 1회 주사위 롤
initialRoll();
updateEntityUI();
</script>
</body>
</html>
