<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GREYMOOR — 3D 블록 공성전</title>
<meta name="description" content="성의 크기와 석재 밀도를 고르고 여러 공성병기로 무너뜨리는 3D 물리 공성전">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff4db;background:#9bc5df}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}.panel{pointer-events:auto;background:#172521e8;border:1px solid #e6d7a155;box-shadow:0 10px 32px #15231f66;border-radius:13px;backdrop-filter:blur(10px)}#brand{position:absolute;top:14px;left:18px;text-shadow:0 2px 8px #233b3b}#brand small{display:block;letter-spacing:.23em;font-size:10px;font-weight:800;color:#fff3bd}h1{margin:0;font:900 clamp(26px,3.3vw,42px) Georgia,serif;letter-spacing:-.045em}#brand p{margin:3px 0;font-size:12px}#status{position:absolute;top:15px;right:16px;padding:11px 14px;min-width:180px;font-size:12px}#status strong{display:block;color:#ffda8a;font-size:17px}#builder{position:absolute;top:95px;left:16px;width:225px;padding:12px 14px;font-size:12px}#builder summary{cursor:pointer;font-weight:900;color:#ffda8a;list-style:none}#builder summary:after{content:' ▾'}#builder[open] summary{margin-bottom:9px}#builder label{display:block;margin:8px 0}#builder input{width:110px;float:right}#builder output{float:right;min-width:40px;text-align:right;color:#ffd88b}#builder select{float:right;width:110px}#builder button{width:100%;margin-top:7px}#limit{display:block;margin-top:6px;color:#d9c8a5;font-size:10px;line-height:1.3;min-height:14px}#controls{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px;max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}#controls label{font-size:11px;font-weight:700;white-space:nowrap}input[type=range]{width:86px;accent-color:#f2bd66;vertical-align:middle}#controls output{display:inline-block;min-width:31px;text-align:right;color:#ffda8a}select,button{font:inherit;border-radius:8px;padding:7px;background:#e2d8bd;color:#1d261d;border:0}button{background:#d4a353;padding:10px 14px;font-weight:900;cursor:pointer}button:hover{background:#f5c771}button:disabled{opacity:.45;cursor:default}#reset{background:#d9e3d3}#tip{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:7px;background:#172521aa;font-size:11px;white-space:nowrap}#message{position:absolute;top:20%;left:50%;transform:translateX(-50%);font:900 clamp(20px,3vw,34px) Georgia,serif;text-shadow:0 3px 15px #1a261a;text-align:center;max-width:90%;white-space:pre-line}@media(max-width:700px){#brand{top:8px;left:10px}#brand p{display:none}#status{top:8px;right:8px;min-width:110px;padding:7px;font-size:10px}#status strong{font-size:13px}#builder{top:70px;left:8px;width:185px;padding:8px}#builder input,#builder select{width:90px}#controls{bottom:5px;gap:6px;padding:8px}#controls input{width:65px}#tip{bottom:116px;font-size:9px}}
</style>
</head>
<body>
<div id="hud">
  <div id="brand"><small>THE FALL OF</small><h1>GREYMOOR</h1><p>돌 하나부터 성 전체까지, 물리 공성전</p></div>
  <div id="status" class="panel"><strong id="stage">성채 준비</strong><div id="shots">발사 0회</div><div id="health">붕괴 0%</div></div>
  <details id="builder" class="panel" open><summary>성채 설계</summary>
    <label>규모 <select id="preset"><option value="small">작은 성</option><option value="medium" selected>보통 성</option><option value="large">큰 성</option><option value="huge">아주 큰 성</option><option value="custom">직접 설정</option></select></label><br>
    <label>가로 폭 <output id="halfValue">16</output><input id="half" aria-label="성 가로 폭" type="range" min="5" max="14" step="1" value="8"></label><br>
    <label>벽 높이 <output id="rowsValue">12</output><input id="rows" aria-label="성벽 높이" type="range" min="8" max="20" step="1" value="12"></label><br>
    <label>블록 크기 <output id="brickValue">0.65</output><input id="brick" aria-label="블록 크기" type="range" min="0.45" max="1.2" step="0.05" value="0.65"></label><br>
    <small id="limit"></small><button id="build">성채 만들기</button>
  </details>
  <div id="message" aria-live="polite"></div>
  <div id="tip">드래그: 회전 · 휠: 확대 · 스페이스: 발사</div>
  <div id="controls" class="panel"><label>공성병기 <select id="weapon"><option value="catapult">투석기</option><option value="trebuchet">트레뷰셋</option><option value="ballista">발리스타</option><option value="cannon">대포</option></select></label><label>방향 <input id="yaw" type="range" min="-28" max="28" value="0"><output id="yawValue">0°</output></label><label>각도 <input id="angle" type="range" min="5" max="65" value="30"><output id="angleValue">30°</output></label><label>화력 <input id="power" type="range" min="16" max="50" value="22"><output id="powerValue">22</output></label><button id="fire">● 발사</button><button id="reset">재건</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="settings.js"></script><script src="game.js"></script>
</body></html>
